name: Fullstack Quality & CI Pipeline

on:
  push:
    branches: [cloud/integration, main]
  pull_request:
    branches: [cloud/integration, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-backend:
    name: Backend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      SUPABASE_JWT_SECRET: ci-mock-secret-placeholder
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client & Build TypeScript
        working-directory: ./backend
        run: npm run build

      - name: Security Scan (Audit)
        working-directory: ./backend
        run: npm audit --audit-level=high || true

  validate-frontend:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: https://api.llemwell.com
      NEXT_PUBLIC_SUPABASE_URL: https://vsznaxvzvwpecevppzex.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint Verification
        working-directory: ./frontend
        run: npx eslint src

      - name: Typecheck
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Security Scan (Audit)
        working-directory: ./frontend
        run: npm audit --audit-level=high || true
